name: Provision GKE Cluster and Deploy Manifests

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REGION: ${{ secrets.GCP_REGION_HML }}
      STATIC_IP: ${{ secrets.STATIC_IP }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up GCP credentials (from base64)
        run: |
          mkdir -p /home/runner/gcp_credentials
          echo "${{ secrets.GCP_CREDENTIALS_BASE64 }}" | base64 -d > /home/runner/gcp_credentials/credentials.json
          chmod 600 /home/runner/gcp_credentials/credentials.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Initialize Terraform
        run: |
          cd terraform
          terraform init

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -out=planfile \
            -var "project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var "region=$REGION" \
            -var "static_ip=$STATIC_IP" \
            -var "credentials_file_path=/home/runner/gcp_credentials/credentials.json"

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve planfile
          CLUSTER_NAME=$(terraform output -raw cluster_name | tr -d '\r')
          INGRESS_IP=$(terraform output -raw ingress_ip_address)
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV
          echo "INGRESS_IP=$INGRESS_IP" >> $GITHUB_ENV

      - name: Configure kubectl manually (secure & plugin-free)
        run: |
          gcloud auth activate-service-account --key-file=/home/runner/gcp_credentials/credentials.json
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

          ACCESS_TOKEN=$(gcloud auth print-access-token)
          CLUSTER_ENDPOINT=$(gcloud container clusters describe $CLUSTER_NAME \
            --region $REGION \
            --format="value(endpoint)")

          CLUSTER_CA=$(gcloud container clusters describe $CLUSTER_NAME \
            --region $REGION \
            --format="value(masterAuth.clusterCaCertificate)")

          echo "$CLUSTER_CA" | base64 -d > /tmp/ca.crt

          kubectl config set-cluster gke-cluster \
            --server=https://$CLUSTER_ENDPOINT \
            --certificate-authority=/tmp/ca.crt

          kubectl config set-credentials gke-user --token=$ACCESS_TOKEN
          kubectl config set-context gke-context \
            --cluster=gke-cluster --user=gke-user
          kubectl config use-context gke-context

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Add NGINX Ingress Controller Helm repository
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update

      - name: Download ingress-nginx-values.yaml from GCS
        run: |
          gsutil cp gs://blog-iris-prod/manifests/ingress/ingress-nginx-values.yaml ./k8s-manifests/ingress/ingress-nginx-values.yaml

      - name: Download ingress-final.yaml from GCS
        run: |
          gsutil cp gs://blog-iris-prod/manifests/ingress/ingress-final.yaml ./k8s-manifests/ingress/ingress-final.yaml

      - name: Install NGINX Ingress Controller
        run: |
          helm install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx --create-namespace \
            -f ./k8s-manifests/ingress/ingress-nginx-values.yaml  # Usando o arquivo de valores no Helm

      - name: Wait for NGINX Ingress Controller to be ready
        run: |
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod -l app.kubernetes.io/name=ingress-nginx --timeout=120s

      - name: Download Kubernetes manifests from GCS
        run: |
          mkdir -p k8s-manifests
          gsutil -m cp -r gs://blog-iris-prod/manifests/* ./k8s-manifests

      - name: Apply namespaces first
        run: |
          kubectl apply --validate=false -f ./k8s-manifests/namespace
          sleep 5

      - name: Apply ingress rules
        run: |
          kubectl apply -f ./k8s-manifests/ingress/ingress-final.yaml  # Aplica o ingress final

      - name: Apply remaining manifests
        run: |
          find ./k8s-manifests -type f -name "*.yaml" ! -name "ingress.yaml" ! -name "ingress-final.yaml" | while read file; do
            echo "Applying $file"
            kubectl apply -f "$file"
          done
